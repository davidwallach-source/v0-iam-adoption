<svg width="440" height="420" viewBox="0 0 440 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Templates empty state illustration">
  <!-- soft ground shadow -->
  <ellipse cx="210" cy="392" rx="150" ry="14" fill="#130032" opacity="0.06"/>

  <!-- document page -->
  <rect x="70" y="70" width="240" height="300" rx="8" fill="#EEF0FB"/>
  <rect x="70" y="70" width="240" height="300" rx="8" fill="#5C50E6" opacity="0.04"/>

  <!-- placeholder text lines -->
  <g fill="#C7CCF2">
    <rect x="96" y="118" width="150" height="10" rx="5"/>
    <rect x="96" y="146" width="188" height="10" rx="5"/>
    <rect x="96" y="174" width="120" height="10" rx="5"/>
    <rect x="96" y="212" width="188" height="10" rx="5"/>
    <rect x="96" y="240" width="150" height="10" rx="5"/>
    <rect x="96" y="300" width="150" height="10" rx="5"/>
  </g>

  <!-- signature field boxes -->
  <rect x="96" y="266" width="80" height="20" rx="3" fill="none" stroke="#2E5BFF" stroke-width="2"/>
  <rect x="96" y="330" width="110" height="20" rx="3" fill="none" stroke="#2E5BFF" stroke-width="2"/>

  <!-- trailing swoosh curves -->
  <path d="M96 300 C 150 250, 250 250, 360 130" fill="none" stroke="#1B3A8F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M112 320 C 170 285, 270 280, 388 178" fill="none" stroke="#3BB6A6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- paper airplane 1 (royal blue) -->
  <g transform="translate(300 96) rotate(-34)">
    <path d="M0 22 L44 0 L30 46 L20 30 Z" fill="#2E5BFF"/>
    <path d="M20 30 L44 0 L30 46 Z" fill="#1B3A8F"/>
  </g>

  <!-- paper airplane 2 (medium blue) -->
  <g transform="translate(344 150) rotate(-34)">
    <path d="M0 20 L40 0 L27 42 L18 27 Z" fill="#5B8DEF"/>
    <path d="M18 27 L40 0 L27 42 Z" fill="#2E5BFF"/>
  </g>

  <!-- paper airplane 3 (light cyan) -->
  <g transform="translate(330 44) rotate(-34)">
    <path d="M0 16 L34 0 L23 34 L15 22 Z" fill="#9FD5F0"/>
    <path d="M15 22 L34 0 L23 34 Z" fill="#6FBEE8"/>
